<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResumeForge — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
</head>
<body>
  <header class="rf-header">
    <a class="rf-brand" href="index.html">ResumeForge</a>
    <nav class="rf-nav"><button class="rf-btn" data-theme-toggle>◐ Theme</button></nav>
  </header>
  <main style="max-width:28rem">
    <section class="rf-card">
      <h1>Welcome back</h1>
      <p class="rf-muted">Authentication is OIDC/PKCE brokered by the BFF (see <code>plan/07-Security-Auth.md</code>).</p>
      <div class="rf-field">
        <label for="email">Email</label>
        <input id="email" class="rf-input" type="email" placeholder="you@example.com" />
      </div>
      <div class="rf-field">
        <label for="pw">Password</label>
        <input id="pw" class="rf-input" type="password" placeholder="••••••••" />
      </div>
      <button class="rf-btn rf-btn--primary" style="width:100%">Sign in</button>
      <p class="rf-row rf-mt" style="justify-content:center"><span class="rf-muted">or</span></p>
      <button class="rf-btn" style="width:100%">Continue with Google (OIDC)</button>
      <p class="rf-muted rf-mt">No account? <a href="dashboard.html">Start free</a></p>
    </section>
  </main>
  <div class="rf-cmdk-backdrop" id="rf-cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="rf-cmdk"><input type="text" placeholder="Type a command… (Esc to close)" aria-label="Command" /><ul><li>Sign in</li><li>Create account</li></ul></div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
