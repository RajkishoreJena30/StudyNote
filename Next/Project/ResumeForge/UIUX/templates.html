<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResumeForge — Templates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
</head>
<body>
  <header class="rf-header">
    <a class="rf-brand" href="index.html">ResumeForge</a>
    <nav class="rf-nav">
      <a class="rf-btn" href="dashboard.html">Dashboard</a>
      <button class="rf-btn" data-theme-toggle>◐ Theme</button>
    </nav>
  </header>
  <main>
    <h1>Choose a template</h1>
    <p class="rf-muted">Virtualized gallery (TanStack Virtual). Free tier: 3 templates · Pro: all.</p>
    <div class="rf-grid cols-3 rf-mt">
      <a class="rf-card" href="editor.html"><div class="rf-preview-doc" style="height:180px">Modern</div><h3 class="rf-mt">Modern</h3><span class="rf-badge rf-badge--ok">ATS-safe</span></a>
      <a class="rf-card" href="editor.html"><div class="rf-preview-doc" style="height:180px">Classic</div><h3 class="rf-mt">Classic</h3><span class="rf-badge rf-badge--ok">ATS-safe</span></a>
      <a class="rf-card" href="editor.html"><div class="rf-preview-doc" style="height:180px">Minimal</div><h3 class="rf-mt">Minimal</h3><span class="rf-badge rf-badge--ok">ATS-safe</span></a>
      <div class="rf-card"><div class="rf-preview-doc" style="height:180px">Compact</div><h3 class="rf-mt">Compact <span class="rf-badge rf-badge--pro">Pro</span></h3></div>
      <div class="rf-card"><div class="rf-preview-doc" style="height:180px">Executive</div><h3 class="rf-mt">Executive <span class="rf-badge rf-badge--pro">Pro</span></h3></div>
      <div class="rf-card" aria-hidden="true"><div class="rf-skeleton" style="height:180px"></div></div>
    </div>
  </main>
  <div class="rf-cmdk-backdrop" id="rf-cmdk" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="rf-cmdk"><input type="text" placeholder="Type a command… (Esc to close)" aria-label="Command" /><ul><li>Use Modern template</li><li>Preview Executive</li></ul></div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
